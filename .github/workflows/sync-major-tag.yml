name: Sync major tag

# Keep the floating major tag (e.g. `v5`) pointing at the latest 3-part semver
# release (e.g. `v5.0.2`). Consumers pin `release-macos.yml@v5` and always track
# the newest v5.x.y without a manual pin bump — mirrors how actions/checkout
# maintains its floating `v5` tag.
#
# Trigger: pushing a tag like `v5.0.2`. This derives the major (`v5`) and
# force-moves it to the same commit. The major tag itself (`v5`) does NOT match
# the 3-part filter, so this never re-triggers; and pushes made with GITHUB_TOKEN
# do not start new workflow runs anyway.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move major tag to this release
        run: |
          set -euo pipefail
          full="${GITHUB_REF_NAME}"   # e.g. v5.0.2
          major="${full%%.*}"         # e.g. v5
          echo "Pointing ${major} -> ${GITHUB_SHA} (from ${full})"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${major}"
