name: CI

# This repository had no CI at all. `release-macos.yml` is `workflow_call` only and
# `sync-major-tag.yml` fires on a tag push, so the 131 tests guarding the release pipeline for
# five apps — scripts/test-tag-gate.sh and scripts/test-workflow-contract.py — ran only when
# somebody remembered to run them by hand.
#
# That is the failure those two suites exist to warn about, one level up. test-tag-gate.sh opens by
# saying a gate that reports success over an unshippable build is worse than no gate;
# test-workflow-contract.py opens by saying a contract test that quietly stops recognising a step
# would report success over a workflow that notarizes unguarded. A suite nobody runs makes exactly
# the same promise and keeps none of it. A PR here can break the tag gate for clipmenu-2, ice-2,
# spectacle-2, yahoo-keykey-2 and dragon-sample-app simultaneously, and until now nothing would
# have caught it before a tag was already pushed.
#
# ubuntu, not macOS: both suites are portable — bash, git and coreutils for the gate tests, and
# stdlib plus PyYAML for the contract tests. Nothing here builds or signs an app, so a macOS runner
# would only cost minutes.
#
# There is an actionlint step now. It was omitted deliberately when this workflow was written,
# because release-macos.yml carried findings that predated it and a job that is red from day one
# teaches everyone to ignore it. Those findings are fixed, so the step can be added honestly:
#
#   SC2012  `ls -d /Applications/Xcode_*.app` became a printf over the glob. `sort -V` stayed —
#           lexical order puts Xcode_9 after Xcode_16 — and the guard became -d rather than -n,
#           since an unmatched glob is left literal and so is non-empty.
#   SC2046  the unquoted `$(security list-keychains)` splits ON PURPOSE: `-s` replaces the search
#           list, so the existing keychains must go back as separate arguments. Documented with a
#           scoped shellcheck disable rather than "fixed" into something that drops the login
#           keychain.
#   four    "property is not defined" errors for job.workflow_repository / job.workflow_sha, which
#           are real and load-bearing — actionlint's context schema simply does not carry them.
#           Suppressed per-file and per-property in .github/actionlint.yaml, which explains why.
#
# The suppression was checked for the failure mode it could introduce: with it in place actionlint
# still reports job.workflow_shaa, job.bogus, and a newly introduced shellcheck finding elsewhere
# in the same file. A linter that has been quieted into always passing is the same failure as a
# gate that reports success over an unshippable build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test-tag-gate.sh builds throwaway repositories with their own tag histories, but the
          # checkout still has to be a real git repo for the harness to work in.
          fetch-depth: 0

      # Preinstalled on the GitHub ubuntu images today; installed explicitly so a change to that
      # image cannot turn the contract tests into a silent skip.
      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # The gate is what stands between a tag and a signed, notarized, published release. It runs
      # first because it is the suite whose failure means "do not ship".
      - name: Tag gate
        run: ./scripts/test-tag-gate.sh

      # And this proves the workflow still calls that gate in the one position where it matters,
      # and that no publishing step can slip past the verification-only guard.
      - name: Workflow contract
        run: python3 scripts/test-workflow-contract.py

      # Last, because a lint finding never means "do not ship" the way the two suites above do.
      # It catches the class of mistake neither of them can see: a YAML or expression error that
      # makes a run fail at STARTUP, which produces no logs at all — the conclusion is set, the
      # run has zero jobs, and the jobs endpoint 404s. Five apps call this workflow, so that
      # failure arrives on a release tag, in somebody else's repository.
      #
      # The pinned official image, the same shape as ice-2's swiftlint job, rather than the
      # upstream curl-into-bash installer. It carries shellcheck, which is where four of the six
      # findings this change fixed came from. Pinned to an exact version and not :latest, because
      # actionlint's context schema is hand-maintained — an upgrade can start reporting properties
      # that were fine yesterday, and that should happen on a deliberate bump, not on a Tuesday.
      - name: actionlint
        run: docker run --rm -v "$PWD:$PWD" -w "$PWD" rhysd/actionlint:1.7.12 -color
