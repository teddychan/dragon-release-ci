name: Release macOS (shared)

# Reusable macOS-app release pipeline shared across Teddy's public Dragon-App
# repos (clipmenu-2, ice-2, yahoo-keykey-2). Each caller passes a `with:` block
# selecting its build front-end and per-repo naming; secrets are inherited.
#
# Build, sign (Developer ID + hardened runtime), notarize, staple, and publish
# the app whenever the caller is triggered by a v* tag. Also publishes the
# EdDSA-signed Sparkle appcast to the marketing site (path-scoped per app) and
# bumps the Homebrew cask. The Mac App Store build is NOT handled here — clipmenu-2
# builds its sandboxed MAS variant in its own release-mas.yml (also GitHub-hosted).
#
# Required secrets (declared below; pass via `secrets: inherit`):
#   DEVELOPER_ID_CERT_P12_BASE64  base64 of the "Developer ID Application" .p12
#   DEVELOPER_ID_CERT_PASSWORD    password set when exporting the .p12
#   NOTARY_KEY_P8_BASE64          base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID                 the API key's Key ID
#   NOTARY_ISSUER_ID              the API key's Issuer ID
# Optional secrets:
#   PROVISIONING_PROFILE_BASE64   base64 provisioning profile (xcodebuild, and swiftpm when swiftpm_icloud_entitlements_path is set)
#   APPLE_TEAM_ID                 Apple developer team id (xcodebuild, and swiftpm iCloud signing)
#   PUBLIC_RELEASE_TOKEN          PAT with write to www.dragonapp.com + homebrew-tap
#   SPARKLE_EDDSA_PRIVATE_KEY     the shared Sparkle EdDSA private key

on:
  workflow_call:
    inputs:
      build_kind:
        description: 'Build front-end: swiftpm | xcodebuild | script'
        type: string
        required: true

      # Display / naming -----------------------------------------------------
      app_slug:
        description: 'Per-app docs slug under docs/<app_slug>/ on the site, also the homebrew cask basename and appcast commit label (e.g. clipmenu-2, ice-2, yahoo-keykey-2)'
        type: string
        required: true
      release_title_prefix:
        description: 'Release title prefix; the tag is appended. clipmenu-2 uses an empty prefix (title == tag). e.g. "Ice 2", "Yahoo KeyKey 2"'
        type: string
        required: false
        default: ''
      bot_name:
        description: 'git user.name for the appcast/cask bot commits'
        type: string
        required: true
      bot_email:
        description: 'git user.email for the appcast/cask bot commits'
        type: string
        required: false
        default: 'release-bot@users.noreply.github.com'

      # Public tag release gate (all build front-ends) ------------------------
      # See dragon-kit/docs/MAC-APP-RELEASE-LIFECYCLE.md and scripts/tag-gate.sh.
      whats_new_path:
        description: "Repo-relative path(s) to the app's What's New source. Accepts a whitespace- or comma-separated list; the FIRST entry is the config file the version and section checks read, and EVERY entry counts toward 'changed since the preceding tag'. List the Localizable.strings files too when the entries are L() keys — spectacle-2, yahoo-keykey-2 and dragon-sample-app keep their note TEXT there, so watching only the .swift lets a full rewrite pass unnoticed, and rejects a real one. REQUIRED: the gate fails when unset, because a check that cannot fail is worse than no check."
        type: string
        required: false
        default: ''
      release_tag:
        description: 'Only for a manual dispatch, where the ref is a branch: names an ALREADY EXISTING exact public vX.Y.Z tag to release. The whole job then checks out THAT COMMIT, not the branch head. A branch name can never become a release version, so leaving this empty on a branch ref fails the gate unless verify_only is true.'
        type: string
        required: false
        default: ''
      verify_only:
        description: 'true: run the gate and the build, then stop. Nothing is signed, notarized, zipped, uploaded, released, published to the appcast, bumped in Homebrew, or dispatched to the marketing site, and no signing/notary secret is even passed to a step. This is the "or run as verification-only" half of the lifecycle spec, and the only way to exercise the pipeline from a branch with no tag.'
        type: boolean
        required: false
        default: false

      build_number_offset:
        description: 'Added to `git rev-list --count HEAD` when stamping CFBundleVersion. Default 0. Needed only when a repo did not always own its releases: Sparkle compares CFBundleVersion (the appcast''s sparkle:version) to decide whether a build is newer, so an app extracted into a fresh repository restarts its commit count and its next release would look OLDER than the one users have installed. Dragon Sample App shipped build 77 from dragon-kit and its new repo starts at 12, so it passes an offset that clears 77. Raising this later is safe; lowering it breaks updates.'
        type: string
        required: false
        default: '0'

      # Version check (all build front-ends) ---------------------------------
      assert_tag_matches_plist:
        description: 'Assert the tag version == the built app CFBundleShortVersionString, failing the release before notarization if they differ. Applies to every build_kind. This is the post-build half of the gate; the pre-build half is the tag gate above.'
        type: boolean
        required: false
        default: false

      # swiftpm front-end (clipmenu-2) ---------------------------------------
      swiftpm_working_directory:
        description: 'Directory holding Package.swift for the swiftpm build'
        type: string
        required: false
        default: 'app'
      swiftpm_bundle_inputs_directory:
        description: 'Directory (repo-root-relative) holding the bundle inputs the swiftpm assembly copies — Info.plist and, when the app ships one, AppIcon.icns. DragonKit CONFORMANCE §R16 puts these in App/, which is not where Package.swift lives. Empty = read them from swiftpm_working_directory, the behaviour before this input existed.'
        type: string
        required: false
        default: ''
      swiftpm_sparkle:
        description: 'Set CLIPMENU_SPARKLE=1 for the swiftpm build (embed Sparkle)'
        type: boolean
        required: false
        default: false
      swiftpm_runner:
        description: 'GitHub-hosted runner image for the swiftpm build. Use macos-26 for apps that target the macOS 26 SDK (clipmenu-2). Default macos-15.'
        type: string
        required: false
        default: 'macos-15'
      swiftpm_icloud_entitlements_path:
        description: 'Entitlements file (repo-root-relative; __TEAM_ID__ substituted) to sign the swiftpm app with, embedding the PROVISIONING_PROFILE_BASE64 profile for iCloud. Empty = local-only (no iCloud).'
        type: string
        required: false
        default: ''
      swiftpm_product_name:
        description: 'SwiftPM product/executable name copied into Contents/MacOS/ and set as CFBundleExecutable. Default ClipMenu.'
        type: string
        required: false
        default: 'ClipMenu'
      swiftpm_app_name_template:
        description: 'Template for the .app filename + CFBundleName/CFBundleDisplayName. Tokens {MAJOR} {VERSION}. Default "ClipMenu {MAJOR}".'
        type: string
        required: false
        default: 'ClipMenu {MAJOR}'

      # xcodebuild front-end (ice-2) -----------------------------------------
      xcode_project:
        description: 'Xcode project for the xcodebuild archive (e.g. Ice.xcodeproj)'
        type: string
        required: false
        default: ''
      xcode_scheme:
        description: 'Xcode scheme for the xcodebuild archive (e.g. Ice)'
        type: string
        required: false
        default: ''
      xcode_export_options:
        description: 'Path to exportOptions.plist for -exportArchive'
        type: string
        required: false
        default: ''
      xcode_development_team:
        description: 'DEVELOPMENT_TEAM passed to xcodebuild archive'
        type: string
        required: false
        default: ''

      # script front-end (yahoo-keykey-2) ------------------------------------
      script_entitlements_path:
        description: 'Entitlements file to pass to codesign of the main app (script front-end). Empty = no entitlements.'
        type: string
        required: false
        default: ''

      # zip / packaging ------------------------------------------------------
      zip_name_template:
        description: 'Zip filename template. Tokens: {MAJOR} {VERSION} {TAG}. e.g. "ClipMenu-{MAJOR}-{TAG}.zip", "Ice-2-{TAG}.zip", "YahooKeyKey2-{VERSION}.zip"'
        type: string
        required: true
      zip_keep_parent:
        description: 'true: ditto --keepParent on the bare .app. false: stage app (+ extra files) and zip the staging dir root (keykey).'
        type: boolean
        required: false
        default: true
      stage_install_txt:
        description: 'When zip_keep_parent is false, also stage a KeyKey Install.txt alongside the app.'
        type: boolean
        required: false
        default: false
      staged_app_name:
        description: 'Filename for the app inside the staging dir when zip_keep_parent is false (e.g. YahooKeyKey2.app)'
        type: string
        required: false
        default: ''

      # appcast --------------------------------------------------------------
      appcast_repo:
        description: 'Repo hosting the Sparkle appcast at docs/<app_slug>/appcast.xml. Default the marketing site; a self-contained app (e.g. dragon-sample-app) can point this at its own repo so nothing is published to the marketing site.'
        type: string
        required: false
        default: 'teddychan/www.dragonapp.com'
      appcast_mirror_repo:
        description: >-
          A SECOND repo to publish the identical appcast to, for the duration of a feed migration.
          Empty (the default) publishes to appcast_repo only, which is every app''s steady state.

          MAC-APP-RELEASE-LIFECYCLE.md wants each app to host its production appcast in its own
          repository, so an outage or a rejected change in the marketing-site repo cannot interfere
          with update delivery — and it requires migrating "by mirroring the old and new locations
          until installed versions have moved to the app-owned URL". With one destination there was
          no way to do that: pointing appcast_repo at the app repo STOPS publishing to the site, and
          every already-installed copy still reads its SUFeedURL from there, so it silently stops
          seeing updates. That is the failure the mirror exists to prevent, not a hypothetical: it
          is the same stranding that deleting dragon-kit''s docs/dragon-sample-app/appcast.xml would
          have caused for any pre-1.4.1 install.

          Migration order per app: set appcast_repo to the app''s own repo and
          appcast_mirror_repo to the site, ship a release, THEN move SUFeedURL in Info.plist to the
          app-owned URL and ship again. Drop the mirror only once no supported version still points
          at the old location. The appcast is generated once and copied to both, so the two can
          never disagree.
        type: string
        required: false
        default: ''
      generate_appcast_glob:
        description: 'find expression locating generate_appcast. One of: swiftpm | xcodebuild | keykey-cache'
        type: string
        required: false
        default: 'swiftpm'
      appcast_maximum_deltas_zero:
        description: 'Pass --maximum-deltas 0 to generate_appcast (keykey)'
        type: boolean
        required: false
        default: false
      appcast_inject_keykey_requirements:
        description: 'Inject sparkle:minimumSystemVersion 12.0 + hardwareRequirements arm64 into the appcast if absent (keykey)'
        type: boolean
        required: false
        default: false

    # Every secret is declared OPTIONAL, including the five signing/notary ones that were
    # `required: true` through v5.
    #
    # Not a relaxation — a prerequisite for `verify_only`. `required: true` is enforced by GitHub
    # at workflow STARTUP, before any step or `if:` is evaluated, so a caller with `secrets:
    # inherit` and no signing secrets could not even begin a verification-only run. Found the
    # first time Dragon Sample App dispatched one: `startup_failure` in 2 seconds, with no log to
    # explain it. A verification run is supposed to need no signing secret at all, and that is
    # only expressible here.
    #
    # A real release still cannot ship without them. The gate runs first; signing and notarization
    # then receive an empty value and hard-fail — before notarization, upload, the appcast, the
    # Homebrew bump and the site dispatch, all of which are separately guarded. So the failure
    # mode moves from "cannot start" to "stops at the signing step it needs", which is both later
    # and clearer. `scripts/test-workflow-contract.py` pins this so nobody restores `required:
    # true` without understanding that it disables verify-only for any repo lacking the secrets.
    secrets:
      DEVELOPER_ID_CERT_P12_BASE64:
        required: false
      DEVELOPER_ID_CERT_PASSWORD:
        required: false
      NOTARY_KEY_P8_BASE64:
        required: false
      NOTARY_KEY_ID:
        required: false
      NOTARY_ISSUER_ID:
        required: false
      PROVISIONING_PROFILE_BASE64:
        required: false
      APPLE_TEAM_ID:
        required: false
      PUBLIC_RELEASE_TOKEN:
        required: false
      SPARKLE_EDDSA_PRIVATE_KEY:
        required: false

permissions:
  contents: write   # upload assets / create the release on the caller repo

jobs:
  build:
    # GitHub-hosted macOS runner. Public repos get free Actions minutes, so no
    # self-hosted runner is needed. The image MUST ship an Xcode new enough for
    # each app's deployment target; the "Select Xcode" step picks the newest
    # installed Xcode. Default macos-15; callers targeting the macOS 26 SDK
    # (clipmenu-2) pass swiftpm_runner: macos-26.
    runs-on: ${{ inputs.swiftpm_runner }}
    steps:
      # State the mode before anything else runs, so the log's first lines say whether this run
      # can publish. A verification-only run that is silently indistinguishable from a release
      # run is how someone concludes "the release worked" from a run that shipped nothing.
      - name: Announce the run mode
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${VERIFY_ONLY:-}" = "true" ]; then
            echo "::notice title=Verification-only run::Gate and build only. Nothing will be signed, notarized, zipped, uploaded, released, published to the appcast, bumped in Homebrew, or dispatched to the marketing site."
            {
              echo "### :mag: Verification-only run"
              echo
              echo "Every side-effecting step is skipped and its credentials are withheld."
              echo "No artifact from this run can reach a user."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Publishing run::A successful run WILL sign, notarize and publish."
            {
              echo "### :rocket: Publishing run"
              echo
              echo "Ref: \`${GITHUB_REF_NAME}\` (${GITHUB_REF_TYPE})${RELEASE_TAG:+, release_tag \`${RELEASE_TAG}\`}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v7
        with:
          # A manual dispatch arrives with the CALLER's BRANCH ref, so the default checkout would
          # build the branch head while the gate validated a tag that points somewhere else
          # entirely — a release whose contents were never the tagged contents. When release_tag
          # is given, check out THAT COMMIT and let the whole job (gate, build, version
          # assertion, packaging) run on it.
          #
          # An empty ref means "use the triggering event's ref", i.e. today's behaviour, so a
          # normal v* tag push is unchanged. A release_tag naming a tag that does not exist fails
          # here in the checkout rather than in the gate; the message is less friendly but the
          # run still stops before anything is built or signed.
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || '' }}
          # Full history so `git rev-list --count HEAD` yields a real, monotonic
          # build number (a shallow clone would always report 1) — and so the gate can see every
          # v* tag when it looks for the one preceding this release. fetch-depth: 0 fetches all
          # branches and tags regardless of `ref`, which is what makes the line above safe.
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Pick the newest Xcode installed on the hosted image (avoids pinning a
          # path that drifts between runner image versions).
          #
          # printf over the glob rather than `ls -d`, which shellcheck flags as SC2012. `sort -V`
          # stays: the glob expands lexically, which would put Xcode_9 after Xcode_16. When
          # nothing matches, the glob is left literal, so the test is -d (the path exists) and not
          # -n (the string is non-empty) — the old -n was true for the unexpanded pattern.
          latest="$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          if [ -d "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          swift --version
          xcodebuild -version

      # This workflow file comes from dragon-release-ci but the checkout above is the CALLER's
      # repo, so the gate script is not on disk yet. Fetch it from this workflow's own repo at
      # the same ref, so the gate and the workflow that runs it can never be different versions.
      #
      # `job.workflow_sha` ("the commit SHA of the workflow file that defines the current job")
      # and `job.workflow_repository` ("the owner/repo of the repository containing the workflow
      # file") are the documented properties for exactly this. Both are GitHub-supplied and
      # trusted; both are documented as NOT available on GitHub Enterprise Server, which does not
      # matter here because every Dragon repo lives on github.com. `github.job_workflow_sha` is
      # not a documented context property and was what this step used to interpolate.
      #
      # actionlint 1.7.12 warns "property not defined in object type" for both of these: its
      # hand-maintained context schema has job.check_run_id but not the job.workflow_* group. It
      # flagged the previous github.job_workflow_sha too, so the warning is not a signal about
      # which spelling is right — the contexts reference is.
      #
      # An undefined context property renders as the EMPTY STRING, and actions/checkout treats an
      # empty ref as "the default branch" — so a typo here would silently check out main and run
      # a gate from a different commit than this workflow. Hence the assertion below: fail, do
      # not fall back.
      - name: Resolve this workflow's own repo and commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "${WORKFLOW_REPOSITORY:-}" ] || [ -z "${WORKFLOW_SHA:-}" ]; then
            echo "::error::job.workflow_repository ('${WORKFLOW_REPOSITORY:-}') or job.workflow_sha ('${WORKFLOW_SHA:-}') resolved empty. Refusing to continue: actions/checkout would fall back to the default branch and run a release gate from a different commit than this workflow. These properties are unavailable on GitHub Enterprise Server." >&2
            exit 1
          fi
          echo "Release-CI scripts will come from ${WORKFLOW_REPOSITORY} @ ${WORKFLOW_SHA}"

      - name: Check out the release-CI scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-ci
          fetch-depth: 1

      # THE GATE. Runs before the certificate import and all three build front-ends, so a
      # rejection costs nothing and — critically — nothing has been signed or notarized yet.
      # The remedy for a failure is a fresh version, because a release tag must never be deleted
      # and re-pushed (GitHub demotes the published Release to a draft whose asset 404s).
      #
      # This replaces `VERSION=${TAG##*v}`, which was actively unsafe: that expansion leaves a
      # value containing no "v" untouched, so a caller triggered by workflow_dispatch arrived
      # with a BRANCH ref and produced VERSION=main. It also accepted prefixed families the
      # lifecycle spec no longer permits.
      - name: Public tag release gate
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WHATS_NEW_PATH: ${{ inputs.whats_new_path }}
          # The gate's only relaxation: with verify_only it accepts a branch with no tag, and
          # then exports an EMPTY VERSION. That is safe solely because every publishing step
          # below is individually guarded on the same input AND starved of its credentials.
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          bash .release-ci/scripts/tag-gate.sh >> "$GITHUB_ENV"

      # The What's New pane IS the release notes, so both the Release body and a localized
      # artifact are derived from it rather than from GitHub's guess at it.
      #
      # This replaces `gh release create --generate-notes` further down, which summarised the PR
      # titles that landed since the previous tag: every published body reads like "docs: realign
      # RELEASING.md with the actual release workflow · release: 2.14.6 — …". That is the commit
      # log, not what the app tells its own users, and it is a second description of the release
      # that nobody wrote and nobody proofread. It also emits whats-new.json carrying every
      # language the app ships, so the marketing site can render localized notes without parsing
      # Swift — five of these apps write their entries as `L()` keys in seven .strings files.
      #
      # Placed HERE, immediately after the gate and before the certificate import, for the same
      # reason the gate is: a rejection must cost nothing. Nothing has been built, signed or
      # notarized yet, and an unresolvable localization key is exactly the kind of thing you want
      # to learn before a 60-minute notary round trip rather than after one.
      #
      # Deliberately NOT guarded by verify_only. Like the version assertion below it is a CHECK,
      # not a side effect, and a verification run from a branch is the cheapest possible place to
      # discover that one of seven translations is missing. TAG / VERSION / PREVIOUS_TAG arrive as
      # real environment variables through $GITHUB_ENV from the gate, so nothing is interpolated
      # into this shell body; VERSION is empty on a verification run with no tag, which the
      # exporter accepts and no publishing step can then use.
      #
      # There is no fallback to --generate-notes if this fails. Restoring one would restore the
      # exact bug being fixed here, invisibly, on the release where the export broke.
      - name: Export the What's New notes (all languages)
        env:
          APP_SLUG: ${{ inputs.app_slug }}
          WHATS_NEW_PATH: ${{ inputs.whats_new_path }}
        run: |
          set -euo pipefail
          WN_JSON="$RUNNER_TEMP/whats-new.json"
          WN_BODY="$RUNNER_TEMP/release-notes.md"
          python3 --version   # stdlib only, but say which interpreter parsed the notes
          python3 .release-ci/scripts/whats-new-export.py \
            --app-name "$APP_SLUG" \
            --repo-dir "$GITHUB_WORKSPACE" \
            --whats-new-path "$WHATS_NEW_PATH" \
            --version "${VERSION:-}" \
            --tag "${TAG:-}" \
            --previous-tag "${PREVIOUS_TAG:-}" \
            --github-repo "$GITHUB_REPOSITORY" \
            --json-out "$WN_JSON" \
            --body-out "$WN_BODY"
          {
            echo "WHATS_NEW_JSON=$WN_JSON"
            echo "RELEASE_NOTES_FILE=$WN_BODY"
          } >> "$GITHUB_ENV"
          # Print the body that will become the Release description. On a verification run this is
          # the whole point of the step: the notes are reviewable before a tag exists.
          {
            echo "### :memo: Release notes, rendered from the What's New pane"
            echo
            cat "$WN_BODY"
          } >> "$GITHUB_STEP_SUMMARY"

      # The Developer ID cert import has no dependency on the app existing, and
      # xcodebuild signs INSIDE the archive — it needs the keychain/identity
      # present at build time. So import the cert here, before all three build
      # front-ends. The swiftpm/script front-ends sign afterward and work fine
      # with the cert already imported.
      #
      # Skipped entirely on a verification-only run: it needs no signing secret, so it is not
      # given one. The `if:` is the first guard and the withheld secrets are the second — if the
      # `if:` were ever dropped, the step would fail on an empty certificate rather than import
      # one. Every guarded step below follows the same two-layer shape.
      - name: Import Developer ID certificate
        if: ${{ !inputs.verify_only }}
        env:
          CERT_P12_BASE64: ${{ !inputs.verify_only && secrets.DEVELOPER_ID_CERT_P12_BASE64 || '' }}
          CERT_PASSWORD: ${{ !inputs.verify_only && secrets.DEVELOPER_ID_CERT_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64:-}" ]; then
            echo "::error::No Developer ID certificate available: the DEVELOPER_ID_CERT_P12_BASE64 secret is unset, or it was withheld because verify_only is true." >&2
            exit 1
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          # Import Apple's intermediate CAs so the Developer ID chain validates.
          for url in \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer; do
            f="$RUNNER_TEMP/$(basename "$url")"
            curl -fsSL -o "$f" "$url" && security import "$f" -k "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # shellcheck disable=SC2046 # word splitting is the point, see below
          # `-s` REPLACES the user search list rather than adding to it, so the keychains already
          # on it have to be handed back — as SEPARATE arguments, which is exactly the splitting
          # SC2046 warns about. Quoting would pass every existing keychain as one argument and
          # drop the login keychain out of the search list. An array would avoid the warning
          # honestly, but this runs in the signing step of every release for five apps and the
          # macOS runner's /bin/bash is 3.2, where `"${arr[@]}"` on an empty array trips `set -u`.
          # The paths are runner-generated and contain no whitespace.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed s/\"//g)
          # Use the cert's SHA-1 hash (unique) as the signing identity, not its
          # name (can collide with a login.keychain copy on self-hosted runners).
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate." >&2
            exit 1
          fi
          echo "Signing identity (SHA-1): $IDENTITY"
          {
            echo "SIGN_IDENTITY=$IDENTITY"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      # --- Build front-end: swiftpm (clipmenu-2) ---------------------------
      - name: Build (release) [swiftpm]
        if: ${{ inputs.build_kind == 'swiftpm' }}
        working-directory: ${{ inputs.swiftpm_working_directory }}
        env:
          CLIPMENU_SPARKLE: ${{ inputs.swiftpm_sparkle && '1' || '' }}
        run: swift build -c release

      - name: Assemble .app bundle [swiftpm]
        if: ${{ inputs.build_kind == 'swiftpm' }}
        working-directory: ${{ inputs.swiftpm_working_directory }}
        env:
          CLIPMENU_SPARKLE: ${{ inputs.swiftpm_sparkle && '1' || '' }}
          SWIFTPM_PRODUCT_NAME: ${{ inputs.swiftpm_product_name }}
          SWIFTPM_APP_NAME_TEMPLATE: ${{ inputs.swiftpm_app_name_template }}
          BUILD_NUMBER_OFFSET: ${{ inputs.build_number_offset }}
          BUNDLE_INPUTS_DIRECTORY: ${{ inputs.swiftpm_bundle_inputs_directory }}
        run: |
          set -euo pipefail
          # Mirror scripts/run.sh's bundle assembly (without launching). APP_NAME is
          # rendered from swiftpm_app_name_template ({MAJOR}/{VERSION} substituted);
          # for ClipMenu that is "ClipMenu 2".
          BIN_PATH="$(swift build -c release --show-bin-path)"
          # Where Info.plist and AppIcon.icns are READ from. This step used to read them from the
          # SwiftPM working directory — the one holding Package.swift — which silently required a
          # repository to keep its bundle inputs beside its manifest. DragonKit CONFORMANCE §R16
          # puts them in `App/` at the repo root instead, for every app whatever builds it, so the
          # two directories are no longer the same one. Empty reproduces the old behaviour exactly,
          # for a caller that has not migrated.
          INPUTS="${PWD}"
          if [ -n "${BUNDLE_INPUTS_DIRECTORY}" ]; then
            INPUTS="${GITHUB_WORKSPACE}/${BUNDLE_INPUTS_DIRECTORY}"
          fi
          # Fail here rather than three commands later. PlistBuddy prints "File Doesn't Exist" on
          # stdout and exits 0, so a wrong directory used to surface as an empty VERSION and a
          # bundle assembled with no identity at all — a release, signed and notarized.
          if [ ! -f "$INPUTS/Info.plist" ]; then
            echo "::error::No Info.plist in ${INPUTS}. §R16 puts it in App/ — point swiftpm_bundle_inputs_directory at that directory (repo-root-relative)." >&2
            exit 1
          fi
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INPUTS/Info.plist")"
          MAJOR="${VERSION%%.*}"
          PRODUCT="$SWIFTPM_PRODUCT_NAME"
          APP_NAME="$SWIFTPM_APP_NAME_TEMPLATE"
          APP_NAME="${APP_NAME//\{MAJOR\}/$MAJOR}"
          APP_NAME="${APP_NAME//\{VERSION\}/$VERSION}"
          APP="${PWD}/.build/${APP_NAME}.app"

          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN_PATH/$PRODUCT" "$APP/Contents/MacOS/$PRODUCT"
          cp "$INPUTS/Info.plist" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ${PRODUCT}" "$APP/Contents/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string ${PRODUCT}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${APP_NAME}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${APP_NAME}" "$APP/Contents/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${APP_NAME}" "$APP/Contents/Info.plist"
          # Build number = git commit count (monotonic). The About pane renders it
          # as "Version X (build)" whenever it differs from the marketing version.
          # Requires the full-history checkout above; falls back to the marketing
          # version if git height is somehow unavailable.
          # Sparkle compares CFBundleVersion, so this must never go backwards — see
          # build_number_offset. `git rev-list --count` restarts at 1 in an extracted repo.
          OFFSET="${BUILD_NUMBER_OFFSET:-0}"
          case "$OFFSET" in ''|*[!0-9]*) echo "::error::build_number_offset must be a non-negative integer, got '$OFFSET'" >&2; exit 1;; esac
          COUNT="$(git rev-list --count HEAD 2>/dev/null || echo "")"
          BUILD="${COUNT:+$((COUNT + OFFSET))}"; BUILD="${BUILD:-$VERSION}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD}" "$APP/Contents/Info.plist"
          # The commit's own timestamp, which DragonKit >= 3.0.0 renders after the build
          # number: "v2.4.1 (756) · 2026-Aug-07 16:54:20 UTC". It used to read the
          # executable's mtime — the moment this job linked and signed the binary — so the
          # two halves of that line described different things and drifted apart. Both now
          # describe the same commit. Stamped before signing; DragonKit shows no date at
          # all when the key is absent, deliberately, so a missing stamp is visible.
          COMMIT_DATE="$(git log -1 --format=%cI 2>/dev/null || true)"
          if [ -n "$COMMIT_DATE" ]; then
            /usr/libexec/PlistBuddy -c "Set :DragonCommitDate ${COMMIT_DATE}" "$APP/Contents/Info.plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :DragonCommitDate string ${COMMIT_DATE}" "$APP/Contents/Info.plist"
          fi
          # App icon is optional: ClipMenu ships AppIcon.icns; the sample app defers
          # a custom icon and falls back to the system default. §R16 checks the icon
          # positionally for the same reason — an app without one is not asked to invent one.
          [ -f "$INPUTS/AppIcon.icns" ] && cp "$INPUTS/AppIcon.icns" "$APP/Contents/Resources/AppIcon.icns" || true

          # Copy every SwiftPM resource bundle (ClipMenu_ClipMenu.bundle, plus any
          # dependency's, e.g. DragonKit_DragonKit.bundle with the kit's localized
          # strings). SwiftPM marks the copied files read-only, hence chmod.
          for BUNDLE_PATH in "$BIN_PATH"/*.bundle; do
            [ -d "$BUNDLE_PATH" ] || continue
            BUNDLE_NAME="$(basename "$BUNDLE_PATH")"
            cp -R "$BUNDLE_PATH" "$APP/Contents/Resources/$BUNDLE_NAME"
            chmod -R u+w "$APP/Contents/Resources/$BUNDLE_NAME"
          done

          # Embed Sparkle.framework (auto-update). The executable finds it via the
          # @loader_path/../Frameworks rpath (Package.swift). cp -R preserves symlinks.
          if [ -d "$BIN_PATH/Sparkle.framework" ]; then
            mkdir -p "$APP/Contents/Frameworks"
            cp -R "$BIN_PATH/Sparkle.framework" "$APP/Contents/Frameworks/Sparkle.framework"
            chmod -R u+w "$APP/Contents/Frameworks/Sparkle.framework"
          else
            echo "::error::CLIPMENU_SPARKLE build did not produce Sparkle.framework at $BIN_PATH" >&2
            exit 1
          fi

          {
            echo "APP=${APP}"
            echo "APP_NAME=${APP_NAME}"
            echo "MAJOR=${MAJOR}"
          } >> "$GITHUB_ENV"

      - name: Sign (Developer ID + hardened runtime) [swiftpm]
        if: ${{ inputs.build_kind == 'swiftpm' && !inputs.verify_only }}
        env:
          PROVISIONING_PROFILE_BASE64: ${{ !inputs.verify_only && secrets.PROVISIONING_PROFILE_BASE64 || '' }}
          APPLE_TEAM_ID: ${{ !inputs.verify_only && secrets.APPLE_TEAM_ID || '' }}
          ICLOUD_ENTITLEMENTS_PATH: ${{ inputs.swiftpm_icloud_entitlements_path }}
        run: |
          set -euo pipefail
          # By default the build is local-only. When the caller passes
          # swiftpm_icloud_entitlements_path AND the PROVISIONING_PROFILE_BASE64 secret
          # is present, embed the provisioning profile and sign the app with those
          # entitlements so iCloud (CloudKit) works in the direct/Homebrew build
          # (clipmenu-2). Otherwise sign local-only — no iCloud (ice-2 / keykey).
          ENTITLEMENTS_ARGS=()
          if [ -n "${ICLOUD_ENTITLEMENTS_PATH}" ] && [ -n "${PROVISIONING_PROFILE_BASE64:-}" ]; then
            if [ -z "${APPLE_TEAM_ID:-}" ]; then
              echo "::error::swiftpm_icloud_entitlements_path is set and PROVISIONING_PROFILE_BASE64 is present, but the APPLE_TEAM_ID secret is missing." >&2
              exit 1
            fi
            echo "Embedding provisioning profile + iCloud entitlements ($ICLOUD_ENTITLEMENTS_PATH)"
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$APP/Contents/embedded.provisionprofile"
            ENT="$RUNNER_TEMP/swiftpm-icloud.entitlements"
            sed "s/__TEAM_ID__/${APPLE_TEAM_ID}/g" "$GITHUB_WORKSPACE/${ICLOUD_ENTITLEMENTS_PATH}" > "$ENT"
            ENTITLEMENTS_ARGS=(--entitlements "$ENT")
          else
            echo "Signing local-only (no iCloud entitlements / provisioning profile)."
          fi

          # Sign nested bundles inside-out, then seal the main bundle, all hardened.
          for RESOURCE_BUNDLE in "$APP"/Contents/Resources/*.bundle; do
            [ -d "$RESOURCE_BUNDLE" ] || continue
            codesign --force --options runtime --timestamp \
              --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$RESOURCE_BUNDLE"
          done

          # Sign Sparkle.framework inside-out (XPC services, Autoupdate, Updater.app,
          # then the framework). --deep is unreliable for notarization, hence explicit.
          SPARKLE_FW="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE_FW" ]; then
            SPARKLE_V="$(/bin/ls -d "$SPARKLE_FW"/Versions/* | grep -v '/Current$' | head -1)"
            for item in "$SPARKLE_V"/XPCServices/*.xpc "$SPARKLE_V/Autoupdate" "$SPARKLE_V/Updater.app"; do
              [ -e "$item" ] || continue
              codesign --force --options runtime --timestamp \
                --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$item"
            done
            codesign --force --options runtime --timestamp \
              --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$SPARKLE_FW"
          fi

          codesign --force --options runtime --timestamp \
            ${ENTITLEMENTS_ARGS[@]+"${ENTITLEMENTS_ARGS[@]}"} \
            --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      # --- Build front-end: xcodebuild (ice-2) -----------------------------
      # Two mutually exclusive steps, because `xcodebuild archive` signs INSIDE the archive:
      # there is no way to archive-and-export without a signing identity, so the verification
      # path compiles the same scheme and configuration with signing switched off instead. It
      # still catches everything a verification run is for — a compile break, a missing
      # resource, a version slip — without producing anything signable.
      - name: Build (unsigned, no archive) [xcodebuild] [verify-only]
        if: ${{ inputs.build_kind == 'xcodebuild' && inputs.verify_only }}
        env:
          XCODE_PROJECT: ${{ inputs.xcode_project }}
          XCODE_SCHEME: ${{ inputs.xcode_scheme }}
          BUILD_NUMBER_OFFSET: ${{ inputs.build_number_offset }}
        run: |
          set -euo pipefail
          # Sparkle compares CFBundleVersion, so this must never go backwards — see
          # build_number_offset. `git rev-list --count` restarts at 1 in an extracted repo.
          OFFSET="${BUILD_NUMBER_OFFSET:-0}"
          case "$OFFSET" in ''|*[!0-9]*) echo "::error::build_number_offset must be a non-negative integer, got '$OFFSET'" >&2; exit 1;; esac
          COUNT="$(git rev-list --count HEAD 2>/dev/null || echo '')"
          BUILD="${COUNT:+$((COUNT + OFFSET))}"
          COMMIT_DATE="$(git log -1 --format=%cI 2>/dev/null || echo '')"
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ${BUILD:+CURRENT_PROJECT_VERSION="$BUILD"} \
            ${COMMIT_DATE:+DRAGON_COMMIT_DATE="$COMMIT_DATE"} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::The verification build produced no .app under $RUNNER_TEMP/dd/Build/Products." >&2
            exit 1
          fi
          # $APP only, deliberately: no DD, because the appcast step that reads it cannot run here.
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Archive + export (Developer ID) [xcodebuild]
        if: ${{ inputs.build_kind == 'xcodebuild' && !inputs.verify_only }}
        env:
          XCODE_PROJECT: ${{ inputs.xcode_project }}
          XCODE_SCHEME: ${{ inputs.xcode_scheme }}
          BUILD_NUMBER_OFFSET: ${{ inputs.build_number_offset }}
          XCODE_EXPORT_OPTIONS: ${{ inputs.xcode_export_options }}
          XCODE_DEVELOPMENT_TEAM: ${{ inputs.xcode_development_team }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/export"
          # Build number = git commit count (monotonic), matching the swiftpm/script
          # paths so Sparkle sees a newer build each release. Passed as a build
          # setting so xcodebuild bakes it into the SIGNED bundle (editing Info.plist
          # after signing would break the signature). Falls back to the project's
          # CURRENT_PROJECT_VERSION if git height is somehow unavailable.
          # Sparkle compares CFBundleVersion, so this must never go backwards — see
          # build_number_offset. `git rev-list --count` restarts at 1 in an extracted repo.
          OFFSET="${BUILD_NUMBER_OFFSET:-0}"
          case "$OFFSET" in ''|*[!0-9]*) echo "::error::build_number_offset must be a non-negative integer, got '$OFFSET'" >&2; exit 1;; esac
          COUNT="$(git rev-list --count HEAD 2>/dev/null || echo '')"
          BUILD="${COUNT:+$((COUNT + OFFSET))}"
          # The commit's own timestamp, rendered by DragonKit >= 3.0.0 after the build
          # number. A build setting rather than a PlistBuddy edit for the same reason as
          # CURRENT_PROJECT_VERSION above: xcodebuild hands back a SIGNED bundle, and
          # editing its Info.plist afterwards breaks the signature. This only reaches the
          # app if its Info.plist maps the key through:
          #     <key>DragonCommitDate</key><string>$(DRAGON_COMMIT_DATE)</string>
          COMMIT_DATE="$(git log -1 --format=%cI 2>/dev/null || echo '')"
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ${BUILD:+CURRENT_PROJECT_VERSION="$BUILD"} \
            ${COMMIT_DATE:+DRAGON_COMMIT_DATE="$COMMIT_DATE"} \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$XCODE_DEVELOPMENT_TEAM"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$XCODE_EXPORT_OPTIONS"
          APP="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::No .app produced by exportArchive." >&2
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "DD=$RUNNER_TEMP/dd" >> "$GITHUB_ENV"
          codesign --verify --strict --verbose=2 "$APP"

      # --- Build front-end: script (yahoo-keykey-2) ------------------------
      - name: Build the LM data + app (swiftc, ad-hoc) [script]
        if: ${{ inputs.build_kind == 'script' }}
        run: |
          set -euo pipefail
          # build-lm.sh produces Resources/data.txt (required by build-app.sh).
          if [ -x tools/build-lm.sh ] && [ ! -f Resources/data.txt ]; then
            tools/build-lm.sh
          fi
          tools/build-app.sh
          APP="$GITHUB_WORKSPACE/build/YahooKeyKey2.app"
          test -d "$APP" || { echo "::error::build-app.sh did not produce $APP" >&2; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Stamp the commit date [script]
        if: ${{ inputs.build_kind == 'script' }}
        run: |
          set -euo pipefail
          # The commit's own timestamp, rendered by DragonKit >= 3.0.0 after the build
          # number. Stamped here rather than inside build-app.sh so a local developer
          # build and a release agree, and because it has to land before the signing step
          # below — editing Info.plist after signing breaks the signature.
          COMMIT_DATE="$(git log -1 --format=%cI 2>/dev/null || true)"
          [ -n "$COMMIT_DATE" ] || exit 0
          /usr/libexec/PlistBuddy -c "Set :DragonCommitDate ${COMMIT_DATE}" "$APP/Contents/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :DragonCommitDate string ${COMMIT_DATE}" "$APP/Contents/Info.plist"

      - name: Sign (Developer ID + hardened runtime) [script]
        if: ${{ inputs.build_kind == 'script' && !inputs.verify_only }}
        env:
          SCRIPT_ENTITLEMENTS_PATH: ${{ inputs.script_entitlements_path }}
        run: |
          set -euo pipefail
          # Mirror tools/package-release.sh: sign Sparkle inside-out (XPC services,
          # Autoupdate, Updater.app, framework), then the app last with entitlements.
          # No --deep — it corrupts Sparkle's nested signatures.
          ENTITLEMENTS_ARGS=()
          if [ -n "${SCRIPT_ENTITLEMENTS_PATH}" ]; then
            ENTITLEMENTS_ARGS=(--entitlements "$GITHUB_WORKSPACE/${SCRIPT_ENTITLEMENTS_PATH}")
          fi
          SPARKLE_FW="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE_FW" ]; then
            SPARKLE_V="$(/bin/ls -d "$SPARKLE_FW"/Versions/* | grep -v '/Current$' | head -1)"
            for item in "$SPARKLE_V"/XPCServices/*.xpc "$SPARKLE_V/Autoupdate" "$SPARKLE_V/Updater.app"; do
              [ -e "$item" ] || continue
              codesign --force --options runtime --timestamp \
                --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$item"
            done
            codesign --force --options runtime --timestamp \
              --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$SPARKLE_FW"
          fi
          codesign --force --options runtime --timestamp \
            ${ENTITLEMENTS_ARGS[@]+"${ENTITLEMENTS_ARGS[@]}"} \
            --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      # --- Common: version check -------------------------------------------
      # Every front-end has set $APP by now, so this guards all three build kinds
      # (it used to live inside the [script] step, where the swiftpm/xcodebuild
      # callers that opted in silently skipped it). Runs before notarization so a
      # version slip fails in seconds instead of after a ~10-60m notary round trip.
      #
      # Deliberately NOT guarded by verify_only: it is a check, not a side effect, and a
      # verification run exists to catch exactly this. It is instead guarded against its own
      # no-op: the gate exports an empty VERSION only on a verification run with no tag, so an
      # empty VERSION on a publishing run means the gate did not run or did not export, and that
      # must be a hard failure rather than a silent pass.
      - name: Assert tag version == CFBundleShortVersionString
        if: ${{ inputs.assert_tag_matches_plist }}
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            if [ "${VERIFY_ONLY:-}" != "true" ]; then
              echo "::error::VERSION is empty on a publishing run. The tag gate must export it; refusing to skip the version assertion." >&2
              exit 1
            fi
            echo "Verification-only run with no tag: no tag version to assert the build against."
            exit 0
          fi
          BUILT_VERSION="$(/usr/bin/plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          if [ "$BUILT_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version ($VERSION) != Info.plist CFBundleShortVersionString ($BUILT_VERSION). Bump the plist or fix the tag." >&2
            exit 1
          fi
          echo "Tag $TAG matches the built app's version ($BUILT_VERSION)."

      # --- Common: notarize ------------------------------------------------
      - name: Notarize and staple
        if: ${{ !inputs.verify_only }}
        env:
          NOTARY_KEY_P8_BASE64: ${{ !inputs.verify_only && secrets.NOTARY_KEY_P8_BASE64 || '' }}
          NOTARY_KEY_ID: ${{ !inputs.verify_only && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ !inputs.verify_only && secrets.NOTARY_ISSUER_ID || '' }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_KEY_P8_BASE64:-}" ]; then
            echo "::error::No notary key available: the NOTARY_KEY_P8_BASE64 secret is unset, or it was withheld because verify_only is true." >&2
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          # notarytool accepts a zip/dmg/pkg, not a bare .app.
          NOTARIZE_ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$NOTARIZE_ZIP"
          CREDS=(--key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          # Submit ONCE (no --wait) and poll ourselves: a transient blip while
          # polling re-polls the SAME submission instead of failing the run.
          SUBMIT_JSON="$RUNNER_TEMP/submit.json"
          xcrun notarytool submit "$NOTARIZE_ZIP" "${CREDS[@]}" --output-format json > "$SUBMIT_JSON"
          SUBMISSION_ID="$(plutil -extract id raw -o - "$SUBMIT_JSON")"
          echo "Notarization submission: $SUBMISSION_ID"
          DEADLINE=$(( SECONDS + 3600 )); STATUS="In Progress"
          while [ "$STATUS" = "In Progress" ]; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Notarization timed out after 60m. Submission: $SUBMISSION_ID" >&2; exit 1
            fi
            sleep 30
            if xcrun notarytool info "$SUBMISSION_ID" "${CREDS[@]}" --output-format json > "$RUNNER_TEMP/info.json" 2>/dev/null; then
              STATUS="$(plutil -extract status raw -o - "$RUNNER_TEMP/info.json")"
              echo "Status: $STATUS"
            else
              echo "::warning::notarytool info poll failed (transient); re-polling $SUBMISSION_ID"
            fi
          done
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization did not succeed (status: $STATUS). Log follows:" >&2
            xcrun notarytool log "$SUBMISSION_ID" "${CREDS[@]}" || true
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      # --- Common: zip -----------------------------------------------------
      # Guarded even though it only writes a local file: this zip exists solely to be uploaded,
      # its name embeds the release version, and the step's own name would be a lie on a run
      # where nothing was notarized.
      - name: Zip notarized app
        if: ${{ !inputs.verify_only }}
        env:
          ZIP_NAME_TEMPLATE: ${{ inputs.zip_name_template }}
          ZIP_KEEP_PARENT: ${{ inputs.zip_keep_parent }}
          STAGED_APP_NAME: ${{ inputs.staged_app_name }}
          STAGE_INSTALL_TXT: ${{ inputs.stage_install_txt }}
        run: |
          set -euo pipefail
          # Expand the zip-name template tokens.
          ZIP_NAME="$ZIP_NAME_TEMPLATE"
          ZIP_NAME="${ZIP_NAME//\{MAJOR\}/${MAJOR:-}}"
          ZIP_NAME="${ZIP_NAME//\{VERSION\}/${VERSION}}"
          ZIP_NAME="${ZIP_NAME//\{TAG\}/${TAG}}"
          ZIP="${GITHUB_WORKSPACE}/${ZIP_NAME}"
          if [ "$ZIP_KEEP_PARENT" = "true" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          else
            # keykey: the same zip is BOTH the user download and the Sparkle update
            # payload. ditto without --keepParent puts the app (+ extra files) at the
            # archive root. Install.txt is built with printf (no heredoc).
            STAGE="$RUNNER_TEMP/zip-stage"
            rm -rf "$STAGE"; mkdir -p "$STAGE"
            cp -R "$APP" "$STAGE/${STAGED_APP_NAME}"
            if [ "$STAGE_INSTALL_TXT" = "true" ]; then
              {
                printf '%s\n' "Yahoo KeyKey 2 — Install" ""
                printf '%s\n' "Install from this zip by copying the app into your Input Methods folder:" ""
                printf '%s\n' "1. Copy \"YahooKeyKey2.app\" into your Input Methods folder:"
                printf '%s\n' "       ~/Library/Input Methods/"
                printf '%s\n' "   (Create the folder if it does not exist. No admin password needed.)" ""
                printf '%s\n' "2. Log out and log back in. macOS only scans input methods at login." ""
                printf '%s\n' "3. System Settings > Keyboard > Input Sources > \"+\", choose Traditional"
                printf '%s\n' "   Chinese, and add Yahoo KeyKey 2 — Cangjie and/or — Simplex." ""
                printf '%s\n' "4. Switch input source with Ctrl-Space and start typing."
              } > "$STAGE/Install.txt"
            fi
            rm -f "$ZIP"
            ditto -c -k "$STAGE" "$ZIP"
          fi
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Upload to release
        if: ${{ !inputs.verify_only }}
        env:
          # Withheld on a verification run, so a `gh` call that somehow ran would fail
          # unauthenticated instead of creating a public GitHub Release.
          GH_TOKEN: ${{ !inputs.verify_only && github.token || '' }}
          RELEASE_TITLE_PREFIX: ${{ inputs.release_title_prefix }}
        run: |
          set -euo pipefail
          PREFIX="$RELEASE_TITLE_PREFIX"
          if [ -n "$PREFIX" ]; then TITLE="$PREFIX $TAG"; else TITLE="$TAG"; fi
          # --notes-file, never --generate-notes: the body is the English rendering of the app's
          # own What's New pane, produced by the export step above (summary, then one `### Kind`
          # heading per section with its entries, then GitHub's `**Full Changelog**` compare link
          # — the one part of the generated notes worth keeping, since a tag-to-tag diff is
          # genuinely useful and is not a restatement of the notes).
          #
          # Still create-or-skip: an existing Release keeps the body it has. Nothing here re-bodies
          # a published release, deliberately — this change applies to future releases only, and a
          # published Release must not be edited or re-tagged to retry.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
                 --notes-file "$RELEASE_NOTES_FILE"
          # whats-new.json rides along as a Release asset: the notes in every language the app
          # ships, so the marketing site reads data instead of scraping this body or parsing Swift.
          gh release upload "$TAG" "$ZIP" "$WHATS_NEW_JSON" --repo "$GITHUB_REPOSITORY" --clobber

      # Deliver the auto-update: this repo's Release is the binary download source,
      # and the EdDSA-signed appcast is published to the marketing site's Pages,
      # path-scoped per app (docs/<app_slug>/appcast.xml), matching SUFeedURL.
      - name: Publish appcast (Sparkle auto-update)
        if: ${{ !inputs.verify_only }}
        env:
          PUBLIC_RELEASE_TOKEN: ${{ !inputs.verify_only && secrets.PUBLIC_RELEASE_TOKEN || '' }}
          GITHUB_TOKEN_SELF: ${{ !inputs.verify_only && github.token || '' }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ !inputs.verify_only && secrets.SPARKLE_EDDSA_PRIVATE_KEY || '' }}
          APPCAST_REPO: ${{ inputs.appcast_repo }}
          APPCAST_MIRROR_REPO: ${{ inputs.appcast_mirror_repo }}
          APP_SLUG: ${{ inputs.app_slug }}
          GENERATE_APPCAST_GLOB: ${{ inputs.generate_appcast_glob }}
          SWIFTPM_WORKING_DIRECTORY: ${{ inputs.swiftpm_working_directory }}
          APPCAST_MAXIMUM_DELTAS_ZERO: ${{ inputs.appcast_maximum_deltas_zero }}
          APPCAST_INJECT_KEYKEY_REQUIREMENTS: ${{ inputs.appcast_inject_keykey_requirements }}
          BOT_NAME: ${{ inputs.bot_name }}
          BOT_EMAIL: ${{ inputs.bot_email }}
        run: |
          set -euo pipefail
          # Pre-check only — the clone below resolves its own token per destination. Publishing to
          # this very repo (a self-hosted appcast, e.g. dragon-sample-app) uses the built-in
          # GITHUB_TOKEN, which already has contents:write here; any other repo needs the cross-repo
          # PUBLIC_RELEASE_TOKEN. A repo with neither this nor the signing key configured skips the
          # appcast with a warning rather than failing, which is the long-standing behaviour. A
          # missing token for a mirror you explicitly asked for is a hard error instead.
          if [ "$APPCAST_REPO" = "$GITHUB_REPOSITORY" ]; then
            PRIMARY_TOKEN="$GITHUB_TOKEN_SELF"
          else
            PRIMARY_TOKEN="${PUBLIC_RELEASE_TOKEN:-}"
          fi
          if [ -z "${PRIMARY_TOKEN:-}" ] || [ -z "${SPARKLE_EDDSA_PRIVATE_KEY:-}" ]; then
            echo "::warning::appcast token (PUBLIC_RELEASE_TOKEN cross-repo, else GITHUB_TOKEN) and/or SPARKLE_EDDSA_PRIVATE_KEY not set — skipping appcast."
            exit 0
          fi
          # Locate generate_appcast per build front-end.
          case "$GENERATE_APPCAST_GLOB" in
            swiftpm)
              GEN="$(find "${GITHUB_WORKSPACE}/${SWIFTPM_WORKING_DIRECTORY}/.build/artifacts" -path '*Sparkle/bin/generate_appcast' -type f | head -1)"
              ;;
            xcodebuild)
              GEN="$(find "$DD/SourcePackages/artifacts" -path '*sparkle/Sparkle/bin/generate_appcast' -type f | head -1)"
              ;;
            keykey-cache)
              GEN="$GITHUB_WORKSPACE/build/sparkle/bin/generate_appcast"
              test -x "$GEN" || { echo "::error::generate_appcast missing (tools/fetch-sparkle.sh should have cached it)." >&2; exit 1; }
              ;;
            *)
              echo "::error::unknown generate_appcast_glob: ${GENERATE_APPCAST_GLOB}" >&2; exit 1
              ;;
          esac
          if [ -z "$GEN" ]; then
            echo "::error::generate_appcast not found." >&2
            exit 1
          fi
          WORK="$RUNNER_TEMP/appcast"; mkdir -p "$WORK"
          cp "$ZIP" "$WORK/"
          KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s\n' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$KEY_FILE"
          OUT="$WORK/appcast.xml"
          GEN_ARGS=(--ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/")
          if [ "$APPCAST_MAXIMUM_DELTAS_ZERO" = "true" ]; then
            GEN_ARGS+=(--maximum-deltas 0)
          fi
          GEN_ARGS+=(-o "$OUT")
          "$GEN" "${GEN_ARGS[@]}" "$WORK"
          if [ "$APPCAST_INJECT_KEYKEY_REQUIREMENTS" = "true" ]; then
            # KeyKey declares min system version / hw requirements only in the appcast.
            # Inject them with perl (robust newline handling) if absent.
            if ! grep -q "sparkle:minimumSystemVersion" "$OUT"; then
              perl -0777 -pi -e 's{</item>}{    <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>\n    <sparkle:hardwareRequirements>arm64</sparkle:hardwareRequirements>\n</item>}g' "$OUT"
            fi
          fi
          # One generated file, copied to every destination, so a mirror can never disagree with
          # the authoritative feed — the two are byte-identical by construction rather than by two
          # generate_appcast runs happening to agree.
          publish_appcast_to() {
            dest="$1"; label="$2"
            # Same rule as the pre-check above, per destination: this very repo is reachable with
            # the built-in GITHUB_TOKEN (contents: write is declared here); any other repo needs
            # the cross-repo PAT. A mirror is by definition a different repo, so it always needs
            # PUBLIC_RELEASE_TOKEN.
            if [ "$dest" = "$GITHUB_REPOSITORY" ]; then
              token="$GITHUB_TOKEN_SELF"
            else
              token="${PUBLIC_RELEASE_TOKEN:-}"
            fi
            if [ -z "${token:-}" ]; then
              echo "::error::no token for the ${label} appcast destination ${dest}: it is not this repository, so it needs PUBLIC_RELEASE_TOKEN." >&2
              return 1
            fi
            pages="$RUNNER_TEMP/pages-$(printf '%s' "$dest" | tr '/' '-')"
            rm -rf "$pages"
            git clone --depth 1 "https://x-access-token:${token}@github.com/${dest}.git" "$pages"
            mkdir -p "$pages/docs/${APP_SLUG}"
            cp "$OUT" "$pages/docs/${APP_SLUG}/appcast.xml"
            ( cd "$pages"
              git config user.name "$BOT_NAME"
              git config user.email "$BOT_EMAIL"
              git add "docs/${APP_SLUG}/appcast.xml"
              # `exit 0` leaves this subshell only, so an unchanged feed at one destination does
              # not skip the next one.
              if git diff --cached --quiet; then echo "  ${label}: unchanged at ${dest}"; exit 0; fi
              git commit --no-verify -m "appcast: ${APP_SLUG} ${TAG}"
              git push origin HEAD:main )
            echo "  ${label}: published ${dest} docs/${APP_SLUG}/appcast.xml"
          }

          publish_appcast_to "$APPCAST_REPO" "appcast"
          if [ -n "${APPCAST_MIRROR_REPO:-}" ]; then
            if [ "$APPCAST_MIRROR_REPO" = "$APPCAST_REPO" ]; then
              echo "::error::appcast_mirror_repo equals appcast_repo (${APPCAST_REPO}). A mirror is a SECOND location; naming the same one twice would push the feed to itself and read as migration coverage that does not exist." >&2
              exit 1
            fi
            # Deliberately fatal, not a warning. During a migration the mirror is the location
            # every ALREADY-INSTALLED copy reads — so a silently un-mirrored feed is precisely the
            # "installed versions stop seeing updates" failure the mirror was added to prevent, and
            # it would be invisible until a user complained. The GitHub Release is already
            # published by this point either way; a red run is the signal to fix it and push a
            # fresh version, per the lifecycle spec's "do not move a release tag".
            publish_appcast_to "$APPCAST_MIRROR_REPO" "migration mirror"
          fi
          # Says which repo, not a hardcoded www.dragonapp.com URL: that line was already wrong for
          # spectacle-2 and dragon-sample-app, which host their own feeds, and a log that names the
          # wrong host is worse than one that names none.
          echo "Appcast delivered for ${APP_SLUG} ${TAG}."

      - name: Bump Homebrew cask
        if: ${{ !inputs.verify_only }}
        env:
          PUBLIC_RELEASE_TOKEN: ${{ !inputs.verify_only && secrets.PUBLIC_RELEASE_TOKEN || '' }}
          APP_SLUG: ${{ inputs.app_slug }}
          BOT_NAME: ${{ inputs.bot_name }}
          BOT_EMAIL: ${{ inputs.bot_email }}
        run: |
          set -euo pipefail
          TAP_REPO="teddychan/homebrew-tap"
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"
          if [ -z "${PUBLIC_RELEASE_TOKEN:-}" ]; then
            echo "::warning::PUBLIC_RELEASE_TOKEN not set — skipping Homebrew cask bump."; exit 0
          fi
          # The cask download URL must resolve before we point users at it.
          if [ "$(curl -sI -L -o /dev/null -w '%{http_code}' "$ASSET_URL")" != "200" ]; then
            echo "::warning::Public asset not live ($ASSET_URL) — skipping Homebrew cask bump."; exit 0
          fi
          SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          REMOTE="https://x-access-token:${PUBLIC_RELEASE_TOKEN}@github.com/${TAP_REPO}.git"
          if ! git clone --depth 1 "$REMOTE" "$TAP_DIR" 2>/dev/null; then
            echo "::warning::Could not clone ${TAP_REPO} (token lacks access?) — skipping cask bump."; exit 0
          fi
          CASK="$TAP_DIR/Casks/${APP_SLUG}.rb"
          /usr/bin/sed -i '' -E \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" \
            "$CASK"
          ( cd "$TAP_DIR"
            git config user.name "$BOT_NAME"
            git config user.email "$BOT_EMAIL"
            git add "Casks/${APP_SLUG}.rb"
            if git diff --cached --quiet; then echo "cask unchanged"; exit 0; fi
            git commit --no-verify -m "${APP_SLUG} ${VERSION}"
            git push origin HEAD:main )
          echo "Bumped Homebrew cask → ${APP_SLUG} ${VERSION} (${SHA})"

      # The marketing site's "What's new" list is generated from the GitHub
      # Releases API, but nothing in this workflow writes it — so every release
      # left www.dragonapp.com advertising the previous version until someone
      # re-ran the site scripts by hand. This nudges the site's own refresh
      # workflow, which re-fetches the notes and opens a PR for review (the copy
      # is marketing-facing, so it is deliberately not auto-merged).
      #
      # Applicability is decided by whether the site actually lists this app in
      # i18n/apps/_index.json — NOT by where the appcast lives. Those differ:
      # spectacle-2 self-hosts its Sparkle feed in its own repo yet still has a
      # marketing page, while dragon-sample-app has no page at all. Reading the
      # index also means adding a new app to the site enables this on its own,
      # with no change here and none in any caller.
      #
      # Sends no client_payload: the site workflow needs none, and omitting it
      # keeps attacker-settable input out of that workflow entirely.
      - name: Ask the marketing site to refresh its changelog
        if: ${{ !inputs.verify_only }}
        env:
          PUBLIC_RELEASE_TOKEN: ${{ !inputs.verify_only && secrets.PUBLIC_RELEASE_TOKEN || '' }}
          APP_SLUG: ${{ inputs.app_slug }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_RELEASE_TOKEN:-}" ]; then
            echo "::warning::PUBLIC_RELEASE_TOKEN not set — skipping site changelog refresh."; exit 0
          fi
          IDX="$(curl -sS -H 'Accept: application/vnd.github.raw' \
            -H "Authorization: Bearer ${PUBLIC_RELEASE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/teddychan/www.dragonapp.com/contents/i18n/apps/_index.json' \
            || true)"
          case "$IDX" in
            *"\"${APP_SLUG}\""*) : ;;
            *)
              echo "${APP_SLUG} has no page on www.dragonapp.com — nothing to refresh."
              exit 0 ;;
          esac
          # Never fail an already-shipped release over a site nudge; the site
          # also refreshes on a weekly cron and can be run by hand.
          CODE="$(curl -sS -o "$RUNNER_TEMP/dispatch.out" -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${PUBLIC_RELEASE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/teddychan/www.dragonapp.com/dispatches' \
            -d '{"event_type":"app-released"}')" || CODE=000
          if [ "$CODE" = "204" ]; then
            echo "Asked www.dragonapp.com to refresh its changelog."
          else
            echo "::warning::changelog refresh dispatch returned HTTP ${CODE}; the site's weekly cron will catch up."
            cat "$RUNNER_TEMP/dispatch.out" 2>/dev/null || true
          fi

      # A verification run's log otherwise ends in a column of grey "skipped" steps, which reads
      # the same as a run that failed to do its job. Say what actually happened.
      - name: Verification-only summary
        if: ${{ inputs.verify_only }}
        env:
          BUILD_KIND: ${{ inputs.build_kind }}
        run: |
          set -euo pipefail
          echo "Verified on ${GITHUB_REF_NAME} (${GITHUB_REF_TYPE}): the public tag release gate (${GATE_MODE:-?}) and an unsigned ${BUILD_KIND} build."
          echo "Not done, by design: sign, notarize, zip, upload, GitHub Release, appcast, Homebrew, site dispatch."
          {
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Gate | passed (\`${GATE_MODE:-?}\`) |"
            echo "| Tag | \`${TAG:-none}\` |"
            echo "| Build | \`${BUILD_KIND}\`, unsigned |"
            echo "| Published | nothing |"
          } >> "$GITHUB_STEP_SUMMARY"
